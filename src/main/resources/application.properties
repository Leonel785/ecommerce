spring.application.name=mini-ecommerce
server.port=${PORT:8080}

# --- Base de datos (sin contraseña por defecto: definir DB_PASSWORD en el entorno / .env) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Sesión y cookies ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En producción (HTTPS) definir COOKIE_SECURE=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# --- Subida de archivos ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- No filtrar detalles internos en errores ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Evita la contraseña autogenerada de Spring Security (se usa BCrypt + SessionGuard) ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Criptografía de datos personales (claves SOLO por variables de entorno) ---
app.crypto.key=${APP_CRYPTO_KEY:}
app.crypto.hmac-key=${APP_HMAC_KEY:}

# --- Datos iniciales ---
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.demo-user=${SEED_DEMO_USER:false}
